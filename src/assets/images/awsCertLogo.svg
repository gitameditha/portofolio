      <stop offset="0%" style="stop-color:#232F3E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#131921;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#awsGrad)"/>
  <!-- AWS Smile arrow shape suggestion -->
  <path d="M40 110 Q100 130 160 110" fill="none" stroke="#FF9900" stroke-width="5" stroke-linecap="round"/>
  <polygon points="155,104 165,110 155,116" fill="#FF9900"/>
  <!-- AWS text -->
  <text x="100" y="88" font-family="'Arial Black', Arial, sans-serif" font-size="32" font-weight="900" fill="#FF9900" text-anchor="middle">AWS</text>
  <!-- Certified text -->
  <rect x="30" y="120" width="140" height="22" rx="4" fill="rgba(255,153,0,0.15)" stroke="rgba(255,153,0,0.3)" stroke-width="1"/>
  <text x="100" y="136" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FF9900" text-anchor="middle">CERTIFIED DEVELOPER</text>
  <text x="100" y="158" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">Associate</text>
  <!-- Star decoration -->
  <text x="100" y="185" font-family="Arial" font-size="14" fill="rgba(255,153,0,0.4)" text-anchor="middle">★ ★ ★</text>
